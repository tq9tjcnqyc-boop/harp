name: Build harp

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS x86_64
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-apple-darwin
      - name: Test (native arm64)
        run: cargo test
      - name: Build (x86_64)
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/harp dist/harp
          shasum -a 256 dist/harp | cut -d' ' -f1 > dist/harp.sha256
          cd dist && zip harp-macos-x86_64.zip harp
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: harp-macos-x86_64
          path: |
            dist/harp-macos-x86_64.zip
            dist/harp.sha256
          if-no-files-found: error
      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/harp-macos-x86_64.zip

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/x86_64-pc-windows-msvc/release/harp.exe dist/harp.exe
          $sha = (Get-FileHash dist/harp.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content dist/harp.sha256 $sha
          Compress-Archive -Path dist/harp.exe -DestinationPath dist/harp-windows-x86_64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: harp-windows-x86_64
          path: |
            dist/harp-windows-x86_64.zip
            dist/harp.sha256
          if-no-files-found: error
      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/harp-windows-x86_64.zip
